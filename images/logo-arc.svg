<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -38 245 255" fill="none">
  <defs>
    <!-- Vibrant Brand Gradients -->
    <linearGradient id="arcBlueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003E7E" />
      <stop offset="50%" stop-color="#005FAA" />
      <stop offset="100%" stop-color="#007ACC" />
    </linearGradient>
    <linearGradient id="arcOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A00" />
      <stop offset="60%" stop-color="#F25100" />
      <stop offset="100%" stop-color="#DE3800" />
    </linearGradient>
    <linearGradient id="arcGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#189B40" />
      <stop offset="100%" stop-color="#28B854" />
    </linearGradient>
    <linearGradient id="arcArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B71C1C" />
      <stop offset="45%" stop-color="#D32F2F" />
      <stop offset="100%" stop-color="#F44336" />
    </linearGradient>

    <filter id="bgShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.12" />
    </filter>
    <filter id="fgShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- ========================================================= -->
  <!-- 1. GRAPHIC BEHIND: SEMI-TRANSPARENT (opacity="0.38")       -->
  <!--    4 Growth Bars across full width + Ascending Red Arrow  -->
  <!-- ========================================================= -->
  <g opacity="0.38" filter="url(#bgShadow)">
    <!-- Bar 1: Royal Blue (Behind Letter A) -->
    <polygon points="28,118 28,68 56,52 56,118" fill="#0066B3" />

    <!-- Bar 2: Emerald Green (Behind space A-R & R stem) -->
    <polygon points="78,118 78,48 106,32 106,118" fill="#2EA043" />

    <!-- Bar 3: Golden Amber (Behind R leg & space R-C) -->
    <polygon points="128,118 128,28 156,12 156,118" fill="#F59E0B" />

    <!-- Bar 4: Vivid Orange (Behind Letter C) -->
    <polygon points="178,118 178,8 206,-8 206,118" fill="#EA580C" />

    <!-- Dynamic Ascending Red Arrow (Sweeping across all bars) -->
    <polygon points="72,82 188,-4 200,4 82,90" fill="url(#arcArrowGrad)" />
    <polygon points="236,-32 192,-24 203,-11 209,4" fill="url(#arcArrowGrad)" />
  </g>

  <!-- ========================================================= -->
  <!-- 2. FOREGROUND: OPAQUE DISTINCT LETTERS A - R - C          -->
  <!-- ========================================================= -->
  <g filter="url(#fgShadow)">
    <!-- LETTER A (Deep Royal Blue) - X: 16 to 80 -->
    <path
      d="M 16 120 L 41 55 L 55 55 L 80 120 L 65 120 L 59 104 L 37 104 L 31 120 Z
         M 42 89 L 54 89 L 48 71 Z"
      fill="url(#arcBlueGrad)"
      fill-rule="evenodd"
    />

    <!-- LETTER R (Vibrant Orange) - X: 88 to 134 -->
    <path
      d="M 88 55 L 115 55 C 127 55 134 63 134 74 C 134 82 129 88 121 90 L 134 120 L 118 120 L 106 93 L 102 93 L 102 120 L 88 120 Z
         M 102 67 L 102 81 L 113 81 C 118 81 121 78 121 74 C 121 70 118 67 113 67 Z"
      fill="url(#arcOrangeGrad)"
      fill-rule="evenodd"
    />

    <!-- LETTER C (Vibrant Emerald Green) - X: 148 to 215 -->
    <path
      d="M 215 73 L 202 82 C 198 75 192 70 184 70 C 172 70 164 79 164 91 C 164 103 172 112 184 112 C 192 112 198 106 202 99 L 215 108 C 208 119 198 125 184 125 C 162 125 148 110 148 91 C 148 72 162 57 184 57 C 198 57 208 63 215 73 Z"
      fill="url(#arcGreenGrad)"
    />
  </g>

  <!-- ========================================================= -->
  <!-- 3. WORDMARK "ARC Solutions" (ENLARGED & PROMINENT)        -->
  <!-- ========================================================= -->
  <text
    x="122"
    y="166"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-weight="800"
    font-size="30"
    fill="#0A192F"
    letter-spacing="-0.5"
  >
    ARC Solutions
  </text>

  <!-- ========================================================= -->
  <!-- 4. SUBTITLE "SOLUCIONES EMPRESARIALES" (ENLARGED & BOLD)  -->
  <!-- ========================================================= -->
  <text
    x="122"
    y="190"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-weight="800"
    font-size="12.5"
    fill="#52647E"
    letter-spacing="2.8"
  >
    SOLUCIONES EMPRESARIALES
  </text>
</svg>